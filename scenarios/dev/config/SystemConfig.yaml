pose: #System
  inertial_sensor: #Subsystem
    imu: #Generic Process
      nodeIMU: #Node
        high_packet_dropped_rate_threshold: 20.0 # Packet rate for dropped IMU messages, that if it's exceeded will trigger a diagnostic.
        low_packet_rx_rate_threshold: 50.0 # Packet rate for received IMU messages,that if it's too low will trigger a diagnostic.
safety: # System
  mode_manager: #Subsystem
    armed_state_manager: #Generic Process
      nodeArmedStateManager: # Node Configuration
        nodes_to_monitor: # Nodes to Monitor for Ready to Arm State
        - nodeBasicTeleopControl
        - nodeServoHat
        - nodeTankDriveExecutor
        - nodeTrajectoryController
        - nodeLocalPoseFuser
