infrastructure_configs:
  frames:
    package: "crawler_app"
    relative_path: "config/infrastructure/tf_frames.yaml"
  topics:
    package: "crawler_app"
    relative_path: "config/infrastructure/topics.yaml"

node_registry:
  example_node1:
    package: "robot_framework_ros2"
    executable: "example_node"

  example_node2:
    package: "robot_framework_ros2"
    executable: "example_node"

  imu_node1:
    package: "robot_framework_ros2"
    launch_file: "Systems/Pose/Subsystems/InertialSensor/Nodes/IMUNode/launch/imu_node.launch.xml"
    parameters:
      target_frame: "imu_frame1"
      imu_topic: "imu1"
      accel_topic: "accel1"
      magnetic_topic: "magnetic1"

  inertial_sensor_fuser_node:
    package: "robot_framework_ros2"
    launch_file: "Systems/Pose/Subsystems/LocalPose/Nodes/InertialSensorFuserNode/launch/inertial_sensor_fuser_node.launch.xml"
    parameters:
      imu1_input_topic: "imu1"
      fused_imu_output_topic: "fused_imu"

  local_pose_fuser_node:
    package: "robot_framework_ros2" 
    launch_file: "Systems/Pose/Subsystems/LocalPose/Nodes/LocalPoseFuserNode/launch/local_pose_fuser_node.launch.xml" #Path to Launch File
    parameters:
      machine_inertial_input_topic: "fused_imu"
      local_pose_output_topic: "local_pose"
      local_pose_angular_accel_output_topic: "local_pose_angular_accel"
